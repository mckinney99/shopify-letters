# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5904cf9b73a4faab36946d484c5b5feb"
name = "Etch"
application_url = "https://etch.direct"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2025-10"

  # Mandatory compliance (privacy) webhooks must be declared here in app config —
  # Shopify ignores API-registered subscriptions for these topics. Handled by the
  # /webhooks route, which verifies HMAC via authenticate.webhook(). See SL-69.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_products,write_cart_transforms,write_validations,read_files,write_files,read_themes"

[auth]
redirect_urls = [
  "https://etch.direct/auth/callback",
  "https://etch.direct/auth/shopify/callback",
  "https://staging.etch.direct/auth/callback",
  "https://staging.etch.direct/auth/shopify/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/shopify/callback"
]
