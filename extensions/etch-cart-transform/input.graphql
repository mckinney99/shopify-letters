query RunInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            metafield(namespace: "etch", key: "pricing_rules") {
              value
            }
          }
        }
      }
      cost {
        amountPerQuantity {
          amount
        }
      }
      attribute(key: "_etch_inputs") {
        value
      }
      correlationAttribute: attribute(key: "_etch_correlation_id") {
        value
      }
    }
  }
}
