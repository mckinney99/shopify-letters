query RunInput {
  cart {
    lines {
      id
      quantity
      cost {
        totalAmount {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            metafield(namespace: "etch", key: "pricing_rules") {
              value
            }
          }
        }
      }
      attributes {
        key
        value
      }
    }
  }
}
