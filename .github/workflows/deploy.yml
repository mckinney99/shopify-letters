name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 394554601568.dkr.ecr.us-east-1.amazonaws.com/etch
  ECS_CLUSTER: etch-cluster
  ECS_SERVICE: etch
  STAGING_ECS_CLUSTER: etch-staging-cluster
  STAGING_ECS_SERVICE: etch-staging
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REPOSITORY:latest" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:latest"

      - name: Deploy to staging
        run: |
          # Deploy the new image to staging first. If the staging service fails
          # to stabilize (circuit breaker fires), this step fails and the
          # production deploy below never runs.
          aws ecs update-service \
            --cluster "$STAGING_ECS_CLUSTER" \
            --service "$STAGING_ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager
          echo "Waiting for staging to stabilize..."
          aws ecs wait services-stable \
            --cluster "$STAGING_ECS_CLUSTER" \
            --services "$STAGING_ECS_SERVICE"

      - name: Deploy to production
        run: |
          # The task definition always references :latest (var.image_tag = "latest" in Terraform).
          # Fargate pulls the image on every task start, so --force-new-deployment picks up
          # the new :latest image pushed above without needing a new task definition revision.
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager
          echo "Waiting for production to reach steady state..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
